services:
  # 1. Classic Node image (full OS: bash, tools) - used for the first demo
  app-classic:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile.classic
    ports:
      - "6661:8080"
    volumes:
      - ./k8s/easter-egg-passwd:/etc/passwd:ro
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./k8s/come-to-code.conf:/etc/come-to-code.conf:ro
      - ./k8s/come-to-code-supersecure-token:/var/run/secrets/come-to-code-supersecure-token:ro

  # 2. Vulnerable container (distroless)
  app-distroless:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile
    ports:
      - "6662:8080"
    volumes:
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./k8s/easter-egg-passwd:/etc/passwd:ro
      - ./k8s/come-to-code.conf:/etc/come-to-code.conf:ro
      - ./k8s/come-to-code-supersecure-token:/var/run/secrets/come-to-code-supersecure-token:ro

  # 3. Hardened container (AppArmor + read-only filesystem)
  app-distroless-hardened:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile
    ports:
      - "6663:8080"
    volumes:
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./k8s/easter-egg-passwd:/etc/passwd:ro
      - ./k8s/come-to-code.conf:/etc/come-to-code.conf:ro
      - ./k8s/come-to-code-supersecure-token:/var/run/secrets/come-to-code-supersecure-token:ro
    read_only: true
    user: "1000"
    security_opt:
      - apparmor=docker-node-hardened

  # 4. Go fileless demo (distroless static) - the memfd_create primitive is available
  app-go-distroless:
    build:
      context: ./src/demo-go
      dockerfile: Dockerfile
    ports:
      - "6664:8080"

  # 5. Go fileless demo + Seccomp - memfd_create denied at the kernel (EPERM)
  app-go-distroless-hardened:
    build:
      context: ./src/demo-go
      dockerfile: Dockerfile
    ports:
      - "6665:8080"
    security_opt:
      - seccomp=./k8s/security/seccomp-go.json
