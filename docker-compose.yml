version: '3.8'

services:
  # 1. Container con immagine Node CLASSICA (piena di bash e tool) - per la prima Demo
  app-classic:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile.classic
    ports:
      - "6661:8080"
    volumes:
      - ./k8s/easter-egg-passwd:/etc/passwd:ro

  # 2. Container vulnerabile (Distroless)
  app-vulnerable:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile
    ports:
      - "6662:8080"
    volumes:
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./k8s/easter-egg-passwd:/etc/passwd:ro

  # 3. Container protetto da Hardening (AppArmor + ReadOnly)
  app-hardened:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile
    ports:
      - "6663:8080"
    volumes:
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./k8s/easter-egg-passwd:/etc/passwd:ro
    read_only: true
    user: "1000"
    security_opt:
      - apparmor=docker-node-hardened
