services:
  # 1. Classic Node image (full OS: bash, tools) - used for the first demo
  app-classic:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile.classic
    ports:
      - "6661:8080"
    volumes:
      - ./k8s/easter-egg-passwd:/etc/passwd:ro
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro

  # 2. Vulnerable container (distroless)
  app-distroless:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile
    ports:
      - "6662:8080"
    volumes:
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./k8s/easter-egg-passwd:/etc/passwd:ro

  # 3. Hardened container (AppArmor + read-only filesystem)
  app-distroless-hardened:
    build:
      context: ./src/demo-node
      dockerfile: Dockerfile
    ports:
      - "6663:8080"
    volumes:
      - ./k8s/mock-token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./k8s/easter-egg-passwd:/etc/passwd:ro
    read_only: true
    user: "1000"
    security_opt:
      - apparmor=docker-node-hardened
